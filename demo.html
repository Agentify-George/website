<!-- MEGAN CONTROL -->
<script>
  window.__MEGAN_STARTED__ = false;

  document.getElementById("open-megan-btn").addEventListener("click", () => {
    const island = document.getElementById("megan-island");

    island.classList.remove("w-[72px]", "h-[72px]", "rounded-full");
    island.classList.add("w-[360px]", "h-[420px]", "rounded-2xl");

    if (!window.__MEGAN_STARTED__) {
      window.__MEGAN_STARTED__ = true;
      window.dispatchEvent(new Event("megan:start"));
    }
  });

  function collapseMegan() {
    const island = document.getElementById("megan-island");
    island.classList.remove("w-[360px]", "h-[420px]", "rounded-2xl");
    island.classList.add("w-[72px]", "h-[72px]", "rounded-full");
  }
</script>

<!-- GEMINI BOOT -->
<script>
  window.addEventListener("megan:start", () => {
