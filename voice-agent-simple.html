<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megan | Agentify AI Voice Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.5;
            }
        }

        .listening-animation {
            animation: listening 1.5s ease-in-out infinite;
        }

        @keyframes listening {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>
    <div class="max-w-md w-full p-6">
        <!-- Main Card -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="w-20 h-20 bg-gradient-to-br from-purple-500 to-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-white mb-2">Megan</h1>
                <p class="text-gray-400 text-sm">Agentify AI Voice Assistant</p>
            </div>

            <!-- Status Display -->
            <div id="status-display" class="text-center mb-6">
                <div id="idle-state" class="block">
                    <p class="text-gray-300 text-sm mb-4">Click the button below to start talking with our AI voice
                        agent</p>
                </div>

                <div id="connecting-state" class="hidden">
                    <div class="flex items-center justify-center gap-2 mb-2">
                        <div class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></div>
                        <p class="text-yellow-400 text-sm font-medium">Connecting...</p>
                    </div>
                </div>

                <div id="listening-state" class="hidden">
                    <div class="flex items-center justify-center gap-2 mb-2">
                        <div class="w-2 h-2 bg-green-400 rounded-full pulse-ring"></div>
                        <p class="text-green-400 text-sm font-medium">Listening...</p>
                    </div>
                    <p class="text-gray-400 text-xs">Speak naturally - Megan is listening</p>
                </div>

                <div id="error-state" class="hidden">
                    <div class="flex items-center justify-center gap-2 mb-2">
                        <div class="w-2 h-2 bg-red-400 rounded-full"></div>
                        <p class="text-red-400 text-sm font-medium">Connection Error</p>
                    </div>
                    <p id="error-message" class="text-gray-400 text-xs"></p>
                </div>
            </div>

            <!-- Call Button -->
            <div class="text-center">
                <button id="call-button"
                    class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-bold py-4 px-8 rounded-2xl transition-all shadow-lg hover:shadow-xl active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="button-text">Start Call</span>
                </button>

                <p class="text-gray-500 text-xs mt-4">
                    🎤 Microphone access required
                </p>
            </div>

            <!-- Info -->
            <div class="mt-6 pt-6 border-t border-white/10">
                <p class="text-gray-400 text-xs text-center">
                    This is a demo of Agentify's AI voice technology.
                    <br>
                    <a href="/" class="text-purple-400 hover:text-purple-300 underline">Learn more about Agentify</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Retell SDK (local) -->
    <script src="/js/retell-client.min.js"></script>

    <script>
        // Configuration
        const RETELL_AGENT_ID = 'agent_8285ad54c45327332b3f374ed5'; // Replace with your WEB CALL agent ID

        // DOM Elements
        const callButton = document.getElementById('call-button');
        const buttonText = document.getElementById('button-text');
        const idleState = document.getElementById('idle-state');
        const connectingState = document.getElementById('connecting-state');
        const listeningState = document.getElementById('listening-state');
        const errorState = document.getElementById('error-state');
        const errorMessage = document.getElementById('error-message');

        // State
        let retellClient = null;
        let isCallActive = false;

        // Initialize Retell Client
        function initRetellClient() {
            try {
                retellClient = new RetellWebClient();

                // Event listeners
                retellClient.on('call_started', () => {
                    console.log('Call started');
                    updateUI('listening');
                });

                retellClient.on('call_ended', () => {
                    console.log('Call ended');
                    updateUI('idle');
                    isCallActive = false;
                });

                retellClient.on('agent_start_talking', () => {
                    console.log('Agent speaking');
                });

                retellClient.on('agent_stop_talking', () => {
                    console.log('Agent stopped speaking');
                });

                retellClient.on('error', (error) => {
                    console.error('Retell error:', error);
                    updateUI('error', error.message || 'Connection failed');
                    isCallActive = false;
                });

            } catch (error) {
                console.error('Failed to initialize Retell client:', error);
                updateUI('error', 'Failed to initialize voice client');
            }
        }

        // Update UI based on state
        function updateUI(state, message = '') {
            // Hide all states
            idleState.classList.add('hidden');
            connectingState.classList.add('hidden');
            listeningState.classList.add('hidden');
            errorState.classList.add('hidden');

            // Show appropriate state
            switch (state) {
                case 'idle':
                    idleState.classList.remove('hidden');
                    buttonText.textContent = 'Start Call';
                    callButton.disabled = false;
                    break;

                case 'connecting':
                    connectingState.classList.remove('hidden');
                    buttonText.textContent = 'Connecting...';
                    callButton.disabled = true;
                    break;

                case 'listening':
                    listeningState.classList.remove('hidden');
                    buttonText.textContent = 'End Call';
                    callButton.disabled = false;
                    break;

                case 'error':
                    errorState.classList.remove('hidden');
                    errorMessage.textContent = message;
                    buttonText.textContent = 'Try Again';
                    callButton.disabled = false;
                    break;
            }
        }

        // Start call
        async function startCall() {
            try {
                updateUI('connecting');

                // Get access token from your backend
                // For now, using direct agent ID (you'll need to implement token endpoint)
                const response = await fetch('/.netlify/functions/get-retell-token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        agentId: RETELL_AGENT_ID
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get access token');
                }

                const data = await response.json();

                await retellClient.startCall({
                    accessToken: data.accessToken,
                    sampleRate: 24000,
                    enableUpdate: true,
                });

                isCallActive = true;

            } catch (error) {
                console.error('Failed to start call:', error);
                updateUI('error', 'Failed to start call. Please check your microphone permissions.');
            }
        }

        // End call
        function endCall() {
            if (retellClient && isCallActive) {
                retellClient.stopCall();
                isCallActive = false;
                updateUI('idle');
            }
        }

        // Button click handler
        callButton.addEventListener('click', () => {
            if (isCallActive) {
                endCall();
            } else {
                startCall();
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initRetellClient();
        });
    </script>
</body>

</html>
